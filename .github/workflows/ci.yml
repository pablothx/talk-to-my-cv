name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Lint + unit tests only: no Ollama, no Groq, no database (ADR-0008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make test
