# Per-embedding-model facts. Vectors from different models are not comparable,
# so everything that depends on the model lives here (ADR-0005, ADR-0006).
embedding_models:
  bge-m3:
    dimension: 1024
    # Minimum top-1 cosine similarity to answer at all (ADR-0006, ADR-0009).
    # Calibrated in step 5 on eval/questions.yaml: the gate-only sweep's best
    # was 0.49, but the full eval with the LLM was better at 0.42
    # (refusal accuracy 0.88 vs 0.82), because the LLM refuses well what the
    # gate lets through. Calibrated on 20 questions: expect overfitting.
    # Override with RELEVANCE_THRESHOLD.
    relevance_threshold: 0.42
