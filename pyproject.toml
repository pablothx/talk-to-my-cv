[project]
name = "talk-to-my-cv"
version = "0.0.0"
description = "Learn RAG in one day by building a chat with your CV. 100% local and free."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk_to_my_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs Ollama, pgvector and the configured LLM provider"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
